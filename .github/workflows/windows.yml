name: Test and package Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        id: dependency_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate --json > production-audit.json
      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: production-audit.json
          if-no-files-found: warn

  windows-installer:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: excel-label-studio-windows
          path: release/*.exe
          if-no-files-found: error
